name: Commons Safety Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository without third-party actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Require governance files
        shell: bash
        run: |
          set -euo pipefail
          for file in GOVERNANCE.md SECURITY.md THREAT_MODEL.md CAPABILITY_BOUNDARIES.md DISCLOSURE_LEVELS.md SAFETY_CASE.md CHANGE_CONTROL.md; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done

      - name: Block obvious committed secrets
        shell: bash
        run: |
          set -euo pipefail
          matches="$(find . -type f \( -name '*.pem' -o -name '*.key' -o -name '.env' -o -name '.env.*' \) -not -path './.git/*' -print)"
          if [ -n "$matches" ]; then
            echo "Secret-like files found:"
            echo "$matches"
            exit 1
          fi

      - name: Validate governance invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "Trust never grants authority." GOVERNANCE.md
          grep -Fq "Default deny applies to consequential actions." GOVERNANCE.md
          grep -Fq "Trust does not confer authority." CAPABILITY_BOUNDARIES.md

      - name: Run governance-focused Python tests when available
        shell: bash
        run: |
          set -euo pipefail
          if [ -d tests ]; then
            python -m unittest tests.test_commons_governance tests.test_civic_governance_policy
          else
            echo "No tests/ directory; skipping governance-focused Python tests."
          fi
