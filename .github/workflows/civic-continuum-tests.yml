name: Civic Continuum Safety Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run bounded safety and continuity tests
        run: |
          python --version
          python -m unittest             tests.test_civic_continuum_demo             tests.test_continuum_contract             tests.test_safety_boundary             tests.test_civic_job_queue             -v
