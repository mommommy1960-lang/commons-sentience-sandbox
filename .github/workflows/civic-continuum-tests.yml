name: Civic Continuum Safety Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository without third-party actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest pandas matplotlib
      - name: Compile repository Python sources
        run: |
          python --version
          python -m compileall -q commons_sentience_sim tools tests run_sim.py
      - name: Run full repository test suite
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run bounded safety and continuity tests
        run: |
          python --version
          python -m unittest discover -s tests -p 'test_civic_*.py' -v
