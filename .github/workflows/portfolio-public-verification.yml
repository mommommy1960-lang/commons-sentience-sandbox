name: Public portfolio source verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/portfolio-public-verification.yml'
      - 'tools/verify_public_portfolio.py'
      - 'docs/continuity/PORTFOLIO_WEB_SERVICES_2026-10-17.md'
permissions:
  contents: read
jobs:
  public-source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: python -m pip install pytest==9.1.1 cryptography==50.0.2 openai==3.33.0
      - name: Verify six pinned public repositories
        run: python tools/verify_public_portfolio.py
      - name: Preserve public evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-portfolio-test-evidence
          path: public-evidence/
          if-no-files-found: error
          retention-days: 30
