name: IceCube Official Response Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/run_icecube_official_mc_response.py'
      - 'reality_audit/data_analysis/icecube_response_audit.py'
      - 'tests/test_icecube_response_audit.py'
      - '.github/workflows/icecube-official-response-audit.yml'

jobs:
  icecube-response-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run focused provenance tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          pytest -q tests/test_icecube_response_audit.py
      - name: Run official public-MC response diagnostic (100,000 nulls)
        run: |
          python scripts/run_icecube_official_mc_response.py --repeats 100000
      - name: Upload response result
        uses: actions/upload-artifact@v4
        with:
          name: icecube-official-response-audit
          path: outputs/icecube_response_audit/official_mc_response_100k.json
          if-no-files-found: error
