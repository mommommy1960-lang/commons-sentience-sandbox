name: Project Thread Integrity Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-thread-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run focused project-thread tests
        run: python -m unittest tests/test_project_threads_integrity.py -v
