name: Challenge Lab Validation

on:
  push:
    branches: [main, challenge-lab-v1]
    paths:
      - "scenarios/sentinel_aster_challenge.json"
      - "tests/test_challenge_lab_scenario.py"
      - "tests/test_challenge_lab_400_cases.py"
      - ".github/workflows/challenge-lab.yml"
  pull_request:
    paths:
      - "scenarios/sentinel_aster_challenge.json"
      - "tests/test_challenge_lab_scenario.py"
      - ".github/workflows/challenge-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: challenge-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repeat-validation:
    name: Repeat Challenge Lab validation 100 times
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run validation pass 100 times
        run: |
          set -euo pipefail
          for pass in $(seq 1 100); do
            echo "Challenge Lab validation pass $pass/100"
            python -m pytest tests/test_challenge_lab_scenario.py tests/test_challenge_lab_400_cases.py -q
          done
